<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویرایشگر رزومه | پیش‌نمایش زنده و دانلود PDF — رساکس</title>
<meta name="description" content="رزومه‌ات را با پیش‌نمایش زنده A4 ویرایش کن، بین ۱۰ قالب حرفه‌ای و رنگ دلخواه انتخاب کن و PDF برداری رایگان دانلود کن یا پورتفولیوی آنلاین منتشر کن.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://resux.jx3.ir/editor.html">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preload" href="assets/fonts/Vazirmatn-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Estedad-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<header class="topbar no-print">
  <div class="container topbar-inner">
    <a class="logo" href="index.html" aria-label="Resux">
      <span class="logo-mark">R</span>
      <span>Resu<em>x</em></span>
    </a>
    <div class="topbar-actions">
      <span class="save-state" id="saveState"><span class="dot"></span><span class="lbl"></span></span>
      <button class="chip" id="langToggle" title="English resume">EN</button>
      <button class="btn btn-ghost btn-sm" id="backupBtn">⬇ <span data-i18n="backupBtn">پشتیبان</span></button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer">⬆ <span data-i18n="restoreBtn">بازگردانی</span><input type="file" id="restoreBtn" accept=".json,application/json" hidden></label>
      <button class="btn btn-ghost btn-sm" id="resetBtn"><span data-i18n="resetBtn">شروع از نو</span></button>
      <button class="btn btn-ghost btn-sm" id="publishBtn">🚀 <span data-i18n="publishBtn">انتشار آنلاین</span></button>
      <button class="btn btn-primary btn-sm" id="printBtn">📄 <span data-i18n="printBtn">دانلود PDF</span></button>
    </div>
  </div>
</header>

<div class="editor-wrap">
  <div class="form-pane no-print">
    <div id="formRoot"></div>
  </div>

  <div class="preview-pane">
    <div class="preview-toolbar no-print">
      <span>A4 · 210×297mm</span>
      <span id="zoomLabel" style="margin-inline-start:auto"></span>
    </div>
    <div class="a4-stage" id="a4Stage"></div>
  </div>
</div>

<button class="fab-preview no-print" id="fabPreview">👁 <span data-i18n="livePreview">پیش‌نمایش زنده</span></button>

<div class="preview-overlay no-print" id="previewOverlay">
  <div class="po-bar">
    <strong data-i18n="livePreview" style="color:var(--ink)">پیش‌نمایش زنده</strong>
    <button class="btn btn-ghost btn-sm" id="poClose">✕ <span data-i18n="close">بستن</span></button>
  </div>
  <div class="po-body" id="a4StageMobile"></div>
</div>

<div class="modal-back no-print" id="publishModal">
  <div class="modal">
    <div class="modal-head"><h3 id="pubTitle">🚀 <span data-i18n="pubTitle">انتشار پورتفولیوی آنلاین</span></h3><button class="x" id="modalClose">×</button></div>
    <div class="modal-body" id="publishBody"></div>
  </div>
</div>

<div class="toast-wrap no-print" id="toastWrap"></div>

<script src="assets/js/qrcode.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/editor.js"></script>
<script>
/* translate static toolbar labels + keep zoom label fresh */
document.addEventListener("DOMContentLoaded", () => {
  const apply = () => {
    const F = I18N[document.documentElement.lang === "en" ? "en" : "fa"];
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = F[el.dataset.i18n];
      if (v) el.textContent = v;
    });
    document.title = F.editorTitle + " | " + (F.langToggleTitle === "رزومه فارسی" ? "رساکس" : "Resux");
  };
  apply();
  /* re-apply after each setLang rebuild */
  const obs = new MutationObserver(apply);
  obs.observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
});
</script>
</body>
</html>
